<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比价助手 - 多平台价格自动对比</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--pri:#ff4d4f;--pri-h:#ff3333;--jd:#e4393c;--tb:#ff5000;--tm:#e03e28;--pdd:#e02e24;--sn:#f5a623;--dy:#222;--green:#52c41a;--blue:#1890ff;--bg:#f5f6f8;--card:#fff;--txt:#1a1a1a;--txt2:#666;--txt3:#999;--border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,.06);--r:12px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
        .header{background:linear-gradient(135deg,#ff4d4f,#ff7875 50%,#ffa940);color:#fff;padding:24px 16px 32px;position:relative}
        .header::after{content:'';position:absolute;bottom:-16px;left:0;right:0;height:32px;background:var(--bg);border-radius:16px 16px 0 0}
        .header h1{font-size:22px;font-weight:800}.header .sub{font-size:13px;opacity:.85;margin-top:2px}
        .hdr-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
        .hdr-btn{padding:6px 14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);transition:.2s}
        .hdr-btn:hover{background:rgba(255,255,255,.3)}
        .hdr-stats{display:flex;gap:16px;margin-top:10px;font-size:12px;opacity:.9}
        .wrap{max-width:640px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}
        .tabs{display:flex;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;padding:4px}
        .tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;border-radius:8px;color:var(--txt2);transition:.2s}
        .tab.active{background:var(--pri);color:#fff}.tab:hover:not(.active){background:#f5f5f5}
        .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
        .search-box{padding:16px}
        .search-input{display:flex;gap:8px;margin-bottom:12px}
        .search-input input{flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;outline:none;transition:.2s}
        .search-input input:focus{border-color:var(--pri)}
        .search-input button{padding:12px 20px;background:var(--pri);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
        .search-input button:hover{background:var(--pri-h)}.search-input button:disabled{background:#ccc}
        .plat-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
        .plat-link{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);text-decoration:none;color:var(--txt);font-size:13px;font-weight:500;transition:.2s;cursor:pointer}
        .plat-link:hover{border-color:var(--pri);background:#fff1f0}
        .plat-link .icon{font-size:16px}.plat-link .name{flex:1}.plat-link .arrow{color:var(--txt3);font-size:11px}
        .price-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .price-cell{padding:10px;border:1.5px solid var(--border);border-radius:10px;text-align:center;transition:.2s}
        .price-cell.has-price{border-color:var(--green);background:#f6ffed}
        .price-cell .cell-plat{font-size:11px;color:var(--txt2);margin-bottom:4px}
        .price-cell .cell-input{width:100%;border:none;text-align:center;font-size:18px;font-weight:700;outline:none;background:transparent;color:var(--pri)}
        .price-cell .cell-input::placeholder{color:#ddd;font-weight:400;font-size:14px}
        .price-cell .cell-url{width:100%;border:none;text-align:center;font-size:10px;outline:none;background:transparent;color:var(--txt3);margin-top:4px}
        .submit-row{margin-top:12px;display:flex;gap:8px}
        .submit-btn{flex:1;padding:12px;background:var(--pri);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
        .submit-btn:hover{background:var(--pri-h)}.submit-btn:disabled{background:#ccc}
        .reset-btn{padding:12px 16px;background:#f5f5f5;color:var(--txt2);border:none;border-radius:10px;font-size:14px;cursor:pointer}
        .result-box{padding:16px}
        .result-title{font-size:16px;font-weight:700;margin-bottom:10px}
        .result-savings{background:#f6ffed;border:1px solid #b7eb8f;border-radius:8px;padding:10px 14px;font-size:14px;color:var(--green);font-weight:600;margin-bottom:12px;text-align:center}
        .result-list{display:flex;flex-direction:column;gap:8px}
        .result-item{display:flex;align-items:center;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);gap:10px}
        .result-item.best{background:#fff7e6;border-color:#ffd666}
        .plat-badge{padding:3px 8px;border-radius:4px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
        .bg-jd{background:var(--jd)}.bg-tb{background:var(--tb)}.bg-tm{background:var(--tm)}.bg-pdd{background:var(--pdd)}.bg-sn{background:var(--sn)}.bg-dy{background:var(--dy)}.bg-other{background:var(--txt3)}
        .result-price{font-size:20px;font-weight:800;flex:1}.result-price.best-price{color:var(--pri)}
        .best-tag{font-size:11px;padding:2px 8px;background:var(--green);color:#fff;border-radius:3px}
        .go-link{font-size:12px;color:var(--blue);text-decoration:none}
        .prod-list{display:flex;flex-direction:column;gap:8px}
        .prod-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.2s}
        .prod-card:active{transform:scale(.99)}
        .prod-top{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start}
        .prod-name{font-size:15px;font-weight:600;flex:1}.prod-meta{font-size:12px;color:var(--txt3);margin-top:4px}
        .prod-lowest{font-size:20px;font-weight:800;color:var(--pri)}.prod-highest{font-size:13px;color:var(--txt3)}
        .prod-badges{display:flex;gap:4px;padding:0 16px 12px;flex-wrap:wrap}
        .mini-badge{padding:2px 6px;border-radius:3px;color:#fff;font-size:10px;font-weight:700}
        .prod-acts{display:flex;border-top:1px solid var(--border)}
        .prod-act{flex:1;padding:10px;text-align:center;font-size:12px;color:var(--txt2);border:none;background:none;cursor:pointer}
        .prod-act:not(:last-child){border-right:1px solid var(--border)}.prod-act:hover{background:#f5f5f5;color:var(--pri)}
        .list-search{display:flex;gap:8px;margin-bottom:16px}
        .list-search input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none}.list-search input:focus{border-color:var(--pri)}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
        .modal-bg.show{opacity:1;pointer-events:all}
        .modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:.3s}
        .modal-bg.show .modal{transform:translateY(0)}
        .modal-hd{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1}
        .modal-hd h3{font-size:16px}.modal-x{width:32px;height:32px;border:none;background:#f5f5f5;border-radius:50%;cursor:pointer;font-size:16px}
        .modal-bd{padding:16px}
        .hist-plat{margin-bottom:16px}.hist-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .hist-name{font-weight:600;font-size:14px}.hist-cur{font-size:18px;font-weight:800;color:var(--pri);margin-left:auto}
        .hist-list{display:flex;flex-direction:column;gap:4px}
        .hist-item{display:flex;justify-content:space-between;padding:8px 12px;background:#fafafa;border-radius:6px;font-size:13px}
        .hist-item .hp{font-weight:600}.hist-item .ht{color:var(--txt3);font-size:11px}
        .add-form{border-top:1px solid var(--border);padding-top:16px;margin-top:16px}
        .add-form h4{font-size:14px;margin-bottom:10px}
        .add-row{display:flex;gap:8px;margin-top:8px}
        .add-row select{padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
        .add-row input{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none}.add-row input:focus{border-color:var(--pri)}
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;transition:.3s}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .empty{text-align:center;padding:40px 20px;color:var(--txt3)}.empty i{font-size:40px;margin-bottom:8px;display:block}.empty p{font-size:14px}
        .loading{text-align:center;padding:24px;color:var(--txt2)}
        .spinner{width:32px;height:32px;border:3px solid #eee;border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:400px){.plat-links{grid-template-columns:repeat(2,1fr)}.price-grid{grid-template-columns:1fr}}
        @media(min-width:768px){.wrap{padding-top:16px}.header{border-radius:0 0 16px 16px;max-width:640px;margin:0 auto}}
    </style>
</head>
<body>

<div class="header">
    <h1>📊 比价助手</h1>
    <p class="sub">输入商品名 → 自动搜索各平台价格 → 一键对比</p>
    <div class="hdr-stats" id="stats"></div>
    <div class="hdr-acts">
        <button class="hdr-btn" onclick="exportCSV()"><i class="fas fa-download"></i> 导出CSV</button>
        <button class="hdr-btn" onclick="clearAll()"><i class="fas fa-trash"></i> 清空数据</button>
    </div>
</div>

<div class="wrap">
    <div class="tabs">
        <button class="tab active" data-t="search" onclick="switchTab('search')">🔍 搜商品比价</button>
        <button class="tab" data-t="list" onclick="switchTab('list')">📦 历史记录</button>
    </div>

    <div id="searchTab">
        <div class="card">
            <div class="search-box">
                <div class="search-input">
                    <input type="text" id="kwInput" placeholder="输入商品名，如：iPhone 16 Pro 256GB" autocomplete="off">
                    <button id="searchBtn" onclick="doSearch()">搜索</button>
                </div>
                <div id="platLinks" style="display:none">
                    <div style="font-size:13px;color:var(--txt2);margin-bottom:8px;font-weight:600">
                        <i class="fas fa-external-link-alt"></i> 点击跳转各平台搜索（新窗口打开）
                    </div>
                    <div class="plat-links" id="platLinksGrid"></div>
                </div>
                <div id="priceEntry" style="display:none">
                    <h3 style="font-size:14px;font-weight:600;margin-bottom:10px;color:var(--txt2)">
                        <i class="fas fa-edit" style="color:var(--pri)"></i> 填入各平台价格（自动搜索已填入）
                    </h3>
                    <div class="price-grid" id="priceGrid"></div>
                    <div class="submit-row">
                        <button class="submit-btn" id="compareBtn" onclick="doCompare()">💾 保存并比价</button>
                        <button class="reset-btn" onclick="resetSearch()">重置</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="resultBox"></div>
    </div>

    <div id="listTab" style="display:none">
        <div class="list-search">
            <input type="text" id="listSearch" placeholder="搜索历史记录..." oninput="debounceLoad()">
        </div>
        <div id="prodList" class="prod-list"></div>
    </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <div class="modal-hd">
            <h3 id="mTitle">商品详情</h3>
            <button class="modal-x" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-bd" id="mBody"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let currentKeyword = '';
let searchTimer = null;

const PLATFORMS = [
    {name:'京东',key:'jd',color:'#e4393c'},
    {name:'淘宝',key:'tb',color:'#ff5000'},
    {name:'天猫',key:'tm',color:'#e03e28'},
    {name:'拼多多',key:'pdd',color:'#e02e24'},
    {name:'苏宁',key:'sn',color:'#f5a623'},
    {name:'抖音',key:'dy',color:'#222'},
];

// ===== LocalStorage Data Layer =====
function getProducts() {
    try { return JSON.parse(localStorage.getItem('bj_products') || '[]'); } catch { return []; }
}
function saveProducts(products) {
    localStorage.setItem('bj_products', JSON.stringify(products));
}
function getPrices() {
    try { return JSON.parse(localStorage.getItem('bj_prices') || '[]'); } catch { return []; }
}
function savePrices(prices) {
    localStorage.setItem('bj_prices', JSON.stringify(prices));
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function now() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function badge(n){const m={京东:'bg-jd',淘宝:'bg-tb',天猫:'bg-tm',拼多多:'bg-pdd',苏宁:'bg-sn',抖音:'bg-dy'};return m[n]||'bg-other'}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

function switchTab(tab){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t===tab));
    document.getElementById('searchTab').style.display=tab==='search'?'block':'none';
    document.getElementById('listTab').style.display=tab==='list'?'block':'none';
    if(tab==='list')loadProducts();
}

function updateStats(){
    const p=getProducts(), pr=getPrices();
    document.getElementById('stats').innerHTML=`<span>📦 ${p.length} 件</span><span>💰 ${pr.length} 条记录</span>`;
}

// ===== Search =====
function generateSearchUrls(keyword){
    const q=encodeURIComponent(keyword);
    return [
        {platform:'京东',url:`https://search.jd.com/Search?keyword=${q}&enc=utf-8`,icon:'🔴'},
        {platform:'淘宝',url:`https://s.taobao.com/search?q=${q}`,icon:'🟠'},
        {platform:'天猫',url:`https://list.tmall.com/search_product.htm?q=${q}`,icon:'🔶'},
        {platform:'拼多多',url:`https://mobile.yangkeduo.com/search_result.html?search_key=${q}`,icon:'🔴'},
        {platform:'苏宁',url:`https://search.suning.com/${q}/`,icon:'🟡'},
        {platform:'抖音',url:`https://haohuo.jinritemai.com/views/search/result?keyword=${q}`,icon:'⚫'},
    ];
}

async function doSearch(){
    const kw=document.getElementById('kwInput').value.trim();
    if(!kw){toast('请输入商品名');return}
    currentKeyword=kw;
    const btn=document.getElementById('searchBtn');
    btn.disabled=true;btn.textContent='搜索中...';

    // Show platform links
    const links=generateSearchUrls(kw);
    document.getElementById('platLinksGrid').innerHTML=links.map(p=>`
        <a class="plat-link" href="${p.url}" target="_blank" rel="noopener">
            <span class="icon">${p.icon}</span><span class="name">${p.platform}</span><span class="arrow">搜索 →</span>
        </a>
    `).join('');
    document.getElementById('platLinks').style.display='block';

    // Init price grid
    renderPriceGrid();

    // Try auto-search via backend
    try{
        const r=await fetch(API+'/api/search-prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:kw})});
        const data=await r.json();
        if(data.results&&data.results.length>0){
            // Auto-fill prices
            data.results.forEach(item=>{
                const key=PLATFORMS.find(p=>p.name===item.platform)?.key;
                if(key){
                    const el=document.getElementById('price_'+key);
                    if(el&&!el.value){el.value=item.price;markFilled(key)}
                    const urlEl=document.getElementById('url_'+key);
                    if(urlEl&&!urlEl.value&&item.url)urlEl.value=item.url;
                }
            });
            toast(`自动找到 ${data.results.length} 个平台的价格 ✅`);
        }
    }catch(e){console.log('Auto-search failed:',e)}

    btn.disabled=false;btn.textContent='搜索';
}

function renderPriceGrid(){
    const grid=document.getElementById('priceGrid');
    grid.innerHTML=PLATFORMS.map(p=>`
        <div class="price-cell" id="cell_${p.key}">
            <div class="cell-plat" style="color:${p.color};font-weight:600">${p.name}</div>
            <input type="number" class="cell-input" id="price_${p.key}" placeholder="输入价格" step="0.01" min="0" oninput="markFilled('${p.key}')">
            <input type="url" class="cell-url" id="url_${p.key}" placeholder="粘贴商品链接">
        </div>
    `).join('');
    document.getElementById('priceEntry').style.display='block';
}

function markFilled(key){
    const cell=document.getElementById('cell_'+key);
    const price=document.getElementById('price_'+key).value;
    cell.classList.toggle('has-price',!!price);
}

function doCompare(){
    if(!currentKeyword){toast('请先搜索');return}
    const prices=[];
    PLATFORMS.forEach(p=>{
        const price=document.getElementById('price_'+p.key).value;
        const url=document.getElementById('url_'+p.key).value;
        if(price)prices.push({platform:p.name,price:parseFloat(price),url,recorded_at:now()});
    });
    if(!prices.length){toast('至少输入一个平台的价格');return}

    // Save to localStorage
    const products=getProducts();
    const allPrices=getPrices();

    // Check if product exists
    let product=products.find(p=>p.name===currentKeyword);
    if(!product){
        product={id:genId(),name:currentKeyword,category:'',created_at:now()};
        products.push(product);
    }
    product.updated_at=now();
    saveProducts(products);

    // Add prices
    prices.forEach(pr=>{
        allPrices.push({id:genId(),product_id:product.id,...pr});
    });
    savePrices(allPrices);

    // Show result
    const sorted=[...prices].sort((a,b)=>a.price-b.price);
    const savings=sorted.length>=2?sorted[sorted.length-1].price-sorted[0].price:0;
    renderResult({name:currentKeyword,prices:sorted.map((p,i)=>({...p,is_cheapest:i===0})),savings});
    updateStats();
    toast('比价已保存 ✅');
}

function renderResult(data){
    const el=document.getElementById('resultBox');
    const savings=data.savings>0?`<div class="result-savings">💰 最多可省 ¥${data.savings.toFixed(2)}</div>`:'';
    el.innerHTML=`<div class="card"><div class="result-box">
        <div class="result-title">"${esc(data.name)}" 比价结果</div>
        ${savings}
        <div class="result-list">${data.prices.map((p,i)=>`
            <div class="result-item ${i===0?'best':''}">
                <span class="plat-badge ${badge(p.platform)}">${p.platform}</span>
                <span class="result-price ${i===0?'best-price':''}">¥${p.price}</span>
                ${i===0?'<span class="best-tag">最低价</span>':''}
                ${p.url?`<a class="go-link" href="${p.url}" target="_blank">去购买 →</a>`:''}
            </div>`).join('')}
        </div>
    </div></div>`;
}

function resetSearch(){
    currentKeyword='';
    document.getElementById('kwInput').value='';
    document.getElementById('platLinks').style.display='none';
    document.getElementById('priceEntry').style.display='none';
    document.getElementById('resultBox').innerHTML='';
}
document.getElementById('kwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});

// ===== Product List =====
function loadProducts(search=''){
    const products=getProducts();
    const allPrices=getPrices();
    let filtered=search?products.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())):products;
    filtered.sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''));
    renderProducts(filtered,allPrices);
}

function renderProducts(products,allPrices){
    const el=document.getElementById('prodList');
    if(!products.length){el.innerHTML=`<div class="empty"><i class="fas fa-box-open"></i><p>还没有记录，去搜索比价吧</p></div>`;return}
    el.innerHTML=products.map(p=>{
        const pPrices=allPrices.filter(pr=>pr.product_id===p.id);
        // Latest price per platform
        const latest={};
        pPrices.forEach(pr=>{if(!latest[pr.platform]||pr.recorded_at>latest[pr.platform].recorded_at)latest[pr.platform]=pr});
        const vals=Object.values(latest).sort((a,b)=>a.price-b.price);
        const badges=vals.map(pr=>`<span class="mini-badge ${badge(pr.platform)}">${pr.platform} ¥${pr.price}</span>`).join('');
        const min=vals[0]?.price,max=vals[vals.length-1]?.price;
        const platformCount=Object.keys(latest).length;
        return `<div class="prod-card" onclick="openProduct('${p.id}')">
            <div class="prod-top">
                <div><div class="prod-name">${esc(p.name)}</div>
                <div class="prod-meta">${platformCount}个平台 · ${p.updated_at||''}</div></div>
                <div>${min?`<span class="prod-lowest">¥${min}</span>`:''}
                ${max&&max!==min?`<span class="prod-highest"> ~¥${max}</span>`:''}</div>
            </div>
            ${badges?`<div class="prod-badges">${badges}</div>`:''}
            <div class="prod-acts">
                <button class="prod-act" onclick="event.stopPropagation();openProduct('${p.id}')"><i class="fas fa-chart-line"></i> 详情</button>
                <button class="prod-act" onclick="event.stopPropagation();deleteProduct('${p.id}','${esc(p.name)}')"><i class="fas fa-trash"></i> 删除</button>
            </div>
        </div>`;
    }).join('');
}
function debounceLoad(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadProducts(document.getElementById('listSearch').value.trim()),300)}

// ===== Product Detail =====
function openProduct(id){
    const products=getProducts();
    const allPrices=getPrices();
    const p=products.find(x=>x.id===id);
    if(!p){toast('商品不存在');return}
    const pPrices=allPrices.filter(pr=>pr.product_id===id);
    renderModal(p,pPrices);
}

function renderModal(p,prices){
    document.getElementById('mTitle').textContent=p.name;
    const byPlat={};
    prices.forEach(pr=>{if(!byPlat[pr.platform])byPlat[pr.platform]=[];byPlat[pr.platform].push(pr)});
    // Sort each platform's prices by date desc
    Object.values(byPlat).forEach(arr=>arr.sort((a,b)=>(b.recorded_at||'').localeCompare(a.recorded_at||'')));
    const plats=Object.keys(byPlat);
    let h='';
    if(!plats.length){h='<div class="empty"><i class="fas fa-tag"></i><p>暂无价格</p></div>'}
    else{
        const cur=plats.map(pl=>({platform:pl,price:byPlat[pl][0].price,url:byPlat[pl][0].url})).sort((a,b)=>a.price-b.price);
        const best=cur[0],sv=cur.length>1?cur[cur.length-1].price-best.price:0;
        if(sv>0)h+=`<div class="result-savings">💰 当前最低 ¥${best.price}（${best.platform}），省 ¥${sv.toFixed(2)}</div>`;
        h+='<div class="result-list" style="margin-bottom:16px">';
        cur.forEach((pr,i)=>{h+=`<div class="result-item ${i===0?'best':''}">
            <span class="plat-badge ${badge(pr.platform)}">${pr.platform}</span>
            <span class="result-price ${i===0?'best-price':''}">¥${pr.price}</span>
            ${i===0?'<span class="best-tag">最低</span>':''}
            ${pr.url?`<a class="go-link" href="${pr.url}" target="_blank">去购买 →</a>`:''}
        </div>`});
        h+='</div>';
        h+='<h4 style="font-size:14px;margin-bottom:12px"><i class="fas fa-history" style="color:var(--pri)"></i> 价格历史</h4>';
        plats.forEach(pl=>{
            h+=`<div class="hist-plat"><div class="hist-hd">
                <span class="mini-badge ${badge(pl)}">${pl}</span>
                <span class="hist-cur">¥${byPlat[pl][0].price}</span></div>
                <div class="hist-list">${byPlat[pl].map(it=>`<div class="hist-item">
                    <span class="hp">¥${it.price}</span><span class="ht">${it.recorded_at||''}</span>
                </div>`).join('')}</div></div>`;
        });
    }
    h+=`<div class="add-form"><h4><i class="fas fa-plus" style="color:var(--pri)"></i> 添加新价格</h4>
        <div class="add-row"><select id="mPlat">${PLATFORMS.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}<option value="其他">其他</option></select>
            <input type="number" placeholder="价格" id="mPrice" step="0.01" min="0">
            <input type="url" placeholder="链接" id="mUrl"></div>
        <button class="submit-btn" style="margin-top:10px" onclick="submitPrice('${p.id}')">记录价格</button></div>`;
    document.getElementById('mBody').innerHTML=h;
    document.getElementById('modalBg').classList.add('show');
}

function submitPrice(pid){
    const platform=document.getElementById('mPlat').value;
    const price=document.getElementById('mPrice').value;
    const url=document.getElementById('mUrl').value;
    if(!price){toast('请输入价格');return}
    const allPrices=getPrices();
    allPrices.push({id:genId(),product_id:pid,platform,price:parseFloat(price),url,recorded_at:now()});
    savePrices(allPrices);
    // Update product timestamp
    const products=getProducts();
    const p=products.find(x=>x.id===pid);
    if(p){p.updated_at=now();saveProducts(products)}
    toast('已记录 ✅');
    openProduct(pid);
    updateStats();
}

function closeModal(){document.getElementById('modalBg').classList.remove('show');loadProducts()}

function deleteProduct(id,name){
    if(!confirm(`删除「${name}」？`))return;
    let products=getProducts().filter(p=>p.id!==id);
    let prices=getPrices().filter(p=>p.product_id!==id);
    saveProducts(products);savePrices(prices);
    toast('已删除');loadProducts();updateStats();
}

function clearAll(){
    if(!confirm('确定清空所有比价数据？'))return;
    localStorage.removeItem('bj_products');
    localStorage.removeItem('bj_prices');
    toast('已清空');loadProducts();updateStats();
}

function exportCSV(){
    const products=getProducts();
    const allPrices=getPrices();
    let csv='\uFEFF商品名称,平台,价格,链接,记录时间\n';
    products.forEach(p=>{
        allPrices.filter(pr=>pr.product_id===p.id).forEach(pr=>{
            csv+=`"${p.name}","${pr.platform}",${pr.price},"${pr.url||''}","${pr.recorded_at||''}"\n`;
        });
    });
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`比价数据_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
}

// Init
updateStats();
</script>
